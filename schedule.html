<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
body { background: #f5f6fa; padding: 20px; color: #333; }
h1 { text-align: center; padding: 20px; color: #2c3e50; }
.toolbar { text-align: center; margin-bottom: 20px; }
.toolbar button { background: #5e72e4; color: white; border: none; padding: 8px 18px; margin: 0 5px; border-radius: 6px; cursor: pointer; }
.toolbar button:hover { background: #4d60d3; }
.toolbar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; width: 200px; margin-left: 10px; }

.schedule { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 1400px; margin: 0 auto; }
.day-col { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.day-header { padding: 10px; text-align: center; background: #fafbfc; border-bottom: 1px solid #eee; }
.day-header h3 { font-size: 14px; color: #1a1a1a; }
.day-header small { color: #999; font-size: 12px; }

.slot { margin: 8px; border-radius: 6px; padding: 10px 8px; font-size: 12px; color: #333; position: relative; min-height: 80px; }
.slot.lv5 { background: #d2f7f8; color: #0c5a5e; }
.slot.lv7 { background: #c7e8ff; color: #1948a8; }
.slot.lv3 { background: #b8f0c2; color: #186131; }
.slot.lv10 { background: #ffb9e0; color: #852c5b; }
.slot.lv8 { background: #b7d3ff; color: #1d3aa0; }
.slot.lv6 { background: #ffd0a3; color: #6c3f0c; }
.slot.lv4 { background: #a8e0ff; color: #134b71; }
.slot.lv2 { background: #cfa9ff; color: #502890; }
.slot.lv9 { background: #fff3a6; color: #8a6200; }
.slot.lvl { background: #ebebff; color: #5252cd; }
.slot.lv1 { background: #fadcf8; color: #81357f; }

.slot .time { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
.slot .name { font-weight: 600; margin: 2px 0; }
.slot .level { font-weight: bold; }
.slot .teacher { margin-top: 5px; font-size: 11px; }
.slot .students { margin-top: 5px; }
.slot .students .s { display: inline-flex; align-items: center; gap: 3px; margin: 2px 3px 2px 0; font-size: 11px; background: rgba(255,255,255,0.5); padding: 2px 6px; border-radius: 10px; }
.slot .students .s::before { content: '👤'; font-size: 9px; }
.slot .count { display: inline-block; margin-left: 4px; padding: 1px 6px; background: rgba(255,255,255,0.5); border-radius: 8px; font-size: 10px; }

.search-results { padding: 10px 20px; }
.match { background: #fff7cc !important; }

.cls-1 { background: linear-gradient(135deg, #bee3ff, #d4ecff) !important; }
.cls-2 { background: linear-gradient(135deg, #a8e6cf, #c4f0dc) !important; }
.cls-3 { background: linear-gradient(135deg, #ffd8a8, #ffe5c8) !important; }
.cls-4 { background: linear-gradient(135deg, #ffb8d8, #ffd0e0) !important; }
.cls-5 { background: linear-gradient(135deg, #d4b8ff, #e5d0ff) !important; }
.cls-6 { background: linear-gradient(135deg, #b8f0ff, #d0f5ff) !important; }
.cls-7 { background: linear-gradient(135deg, #f5e0a8, #fff0c8) !important; }
.cls-8 { background: linear-gradient(135deg, #a8e8f0, #d0f4ff) !important; }
</style>

let currentWeek = DATA.weekKeys[0] || new Date().toISOString().substring(0,10);

function calcWeek(offset) {
  const d = new Date(currentWeek);
  d.setDate(d.getDate() + offset * 7);
  return d.toISOString().substring(0, 10);
}

function prevWeek() { currentWeek = calcWeek(-1); render(); }
function nextWeek() { currentWeek = calcWeek(1); render(); }
function thisWeek() {
  const d = new Date();
  d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
  currentWeek = d.toISOString().substring(0, 10);
  render();
}

function matchWeek(weekKey) {
  return DATA.classes.filter(c => {
    const d = new Date(c.beginDate);
    const mon = new Date(d);
    mon.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
    return mon.toISOString().substring(0,10) === weekKey;
  });
}

function render() {
  const weekClasses = matchWeek(currentWeek);
  const dows = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentWeek);
    d.setDate(d.getDate() + i);
    dows.push(d);
  }
  
  const dailyMap = dows.map(d => {
    const dStr = d.toISOString().substring(0, 10);
    return weekClasses.filter(c => c.beginDate?.substring(0,10) === dStr).sort((a, b) => (a.beginDate || '').localeCompare(b.beginDate || ''));
  });

  const html = '<div class="schedule">' + dows.map((d, idx) => {
    const slots = dailyMap[idx];
    const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const dayCells = slots.map(c => {
      const t = (c.beginDate?.substring(11,16)) + '-' + (c.endDate?.substring(11,16) || '');
      const teacher = (c.teachers || [])[0]?.teacherName || '';
      const stulist = DATA.students[c.classId] || [];
      const studentsHtml = stulist.slice(0, 8).map(s => '<span class="s" data-name="' + s.name + '">' + s.name + '</span>').join('') 
        + (stulist.length > 8 ? '<span class="s">+' + (stulist.length - 8) + '</span>' : '');
      const cnMatch = c.className?.match(/幼[小中大]?[0-9]+|初中|小学|成人/);
      const cnAge = cnMatch ? cnMatch[0] : '';
      // Class color by hash
      const colorIdx = (c.classId || '').split('').reduce((a,c)=>a+(c.charCodeAt(0)%8),0) % 8 + 1;
      return '<div class="slot cls-' + colorIdx + '" data-cn="' + c.className + '" data-teacher="' + teacher + '" data-stu=\'' + JSON.stringify(stulist.map(s=>s.name)) + '\'>' +
        '<div class="time">' + t + '</div>' +
        '<div class="name">' + c.className?.substring(0, 18) + '</div>' +
        '<div class="level">' + cnAge + '</div>' +
        '<div class="teacher">👨‍🏫 ' + teacher + '</div>' +
        '<div class="students">' + studentsHtml + '<span class="count">共' + stulist.length + '</span></div>' +
        '</div>';
    }).join('');
    
    return '<div class="day-col"><div class="day-header"><h3>' + dayNames[d.getDay()] + '</h3><small>' + d.toISOString().substring(5,10) + '</small></div>' + dayCells + '</div>';
  }).join('') + '</div>';
  
  document.getElementById('timetable').innerHTML = html;
}

function search(q) {
  if (!q) { render(); return; }
  q = q.toLowerCase();
  document.querySelectorAll('.slot').forEach(s => s.classList.add('match'));
  document.querySelectorAll('.slot').forEach(s => {
    const cn = (s.dataset.cn || '').toLowerCase();
    const stu = JSON.parse(s.dataset.stu || '[]').join(' ').toLowerCase();
    if (cn.indexOf(q) < 0 && stu.indexOf(q) < 0) s.classList.remove('match');
  });
}
function filterTeacher(name) {
  document.querySelectorAll('.slot').forEach(s => s.style.display = '');
  if (!name) return;
  document.querySelectorAll('.slot').forEach(s => {
    if (!(s.dataset.teacher || '').includes(name)) s.style.display = 'none';
  });
  document.querySelectorAll('.day-col').forEach(col => {
    col.style.display = col.querySelectorAll('.slot[style*="display: none"]').length === col.querySelectorAll('.slot').length ? 'none' : '';
  });
}

render();
