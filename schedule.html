<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
body { background: #f0f2f5; padding: 16px; color: #333; }
h1 { text-align: center; padding: 16px 0 8px; font-size: 20px; }
.toolbar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; flex-wrap: wrap; }
.toolbar button { background: #5e72e4; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.toolbar button:hover { background: #4d60d3; }
.toolbar input { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px; width: 160px; }
.week-label { font-weight: bold; min-width: 200px; text-align: center; }

.schedule { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 1500px; margin: 0 auto; }
.day-col { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.day-header { padding: 8px; text-align: center; border-bottom: 2px solid #5e72e4; font-size: 13px; font-weight: 600; }
.day-header .date { font-size: 11px; color: #666; margin-top: 2px; }
.slot { margin: 5px 4px; border-radius: 6px; padding: 8px 6px; font-size: 11px; border-left: 3px solid #5e72e4; background: #f8f9ff; }
.slot.past { opacity: 0.5; }
.slot .time { font-weight: bold; font-size: 12px; margin-bottom: 2px; }
.slot .cname { font-weight: 600; margin: 2px 0; }
.slot .info { color: #777; font-size: 10px; }
.slot .teacher { margin-top: 3px; font-size: 10px; color: #5e72e4; }
.slot .stulist { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px; }
.slot .stu { background: #e8ecff; padding: 1px 5px; border-radius: 8px; font-size: 10px; white-space: nowrap; }
.slot .more { color: #999; font-size: 10px; align-self: center; }

.teacher-pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; max-width: 1500px; margin: 0 auto; justify-content: center; }
.teacher-pill { padding: 4px 12px; border-radius: 16px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 12px; }
.teacher-pill:hover { border-color: #5e72e4; }
.teacher-pill.active { background: #5e72e4; color: white; border-color: #5e72e4; }
.teacher-pill .count { font-size: 10px; opacity: 0.7; }

.empty-msg { text-align: center; padding: 40px; color: #999; font-size: 14px; }
</style>
</head>

// 中国习惯：周一开始
const DAYS = ['一','二','三','四','五','六','日'];
const DAY_ORDER = [1,2,3,4,5,6,0]; // Mon..Sun (对应getDay索引)

// 当前周的 Monday（纯本地时间，+08:00）
function getTodayMondayStr() {
  const n = new Date();
  const mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - (n.getDay() === 0 ? 6 : n.getDay() - 1));
  return mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0');
}

let activeWeek = getTodayMondayStr();
let activeTeacher = '';
const colors = ['#5e72e4','#2dce89','#fb6340','#11cdef','#f5365c','#8965e0','#ffd600','#00bcd4','#ff6f00','#8d6e63','#26a69a','#7e57c2','#66bb6a','#ef5350','#42a5f5'];

function getLessonColor(classId) {
  let hash = 0; for(let c of (classId||'')) hash = (hash*31 + c.charCodeAt(0)) & 0xffffffff;
  return colors[Math.abs(hash) % colors.length];
}

function getMondayStr(week) {
  const d = new Date(week + 'T00:00:00+08:00');
  const day = d.getDay();
  const mon = new Date(d);
  if (day !== 0) mon.setDate(d.getDate() - day + 1);
  else mon.setDate(d.getDate() - 6);
  return mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0');
}

function localDateStr(d) {
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function render() {
  const realWeek = getMondayStr(activeWeek);
  const weekData = DATA.weekDays[realWeek] || [];
  const monday = new Date(realWeek + 'T00:00:00+08:00');
  const sunday = new Date(monday.getTime() + 6*86400000);
  const isThisWeek = realWeek === getTodayMondayStr();
  document.getElementById('weekLabel').textContent = (isThisWeek ? '本周 · ' : '') + localDateStr(monday) + ' ~ ' + localDateStr(sunday);

  let totalLessons = 0;
  for(let d=0; d<7; d++) totalLessons += (weekData[d] || []).length;

  // 本周无课时显示空本周，不再自动跳转
  if (totalLessons === 0) {
    let html = '<div class="schedule">';
    for(let i=0; i<7; i++) {
      const dayDate = new Date(monday.getTime() + i*86400000);
      const dateStr = localDateStr(dayDate);
      const isToday = dayDate.toDateString() === new Date().toDateString();
      html += '<div class="day-col"><div class="day-header" style="' + (isToday?'background:#fff8e1;':'') + '">星期' + DAYS[i] + '<br><span class="date">' + dateStr + '</span></div></div>';
    }
    html += '</div>';
    document.getElementById('timetable').innerHTML = '<div class="empty-msg" style="margin-bottom:10px">本周暂无课程安排</div>' + html;
    renderPills();
    return;
  }

  let html = '<div class="schedule">';
  for(let i=0; i<7; i++) {
    const d = DAY_ORDER[i]; // Mon..Sun 顺序
    const dayDate = new Date(monday.getTime() + i*86400000);
    const dateStr = localDateStr(dayDate);
    const isToday = dayDate.toDateString() === new Date().toDateString();
    const slots = (weekData[d] || []).slice().sort((a,b) => (a.beginDate||'').localeCompare(b.beginDate||''));

    html += '<div class="day-col"><div class="day-header" style="' + (isToday?'background:#fff8e1;':'') + '">星期' + DAYS[i] + '<br><span class="date">' + dateStr + '</span></div>';

    for(const l of slots) {
      const cls = DATA.classMap[l.classInfo?.classId] || {};
      const teacherName = (cls.teachers||[])[0] || '';
      if(activeTeacher && !(cls.teachers||[]).includes(activeTeacher)) continue;

      const begin = l.beginDate || '';
      const end = l.endDate || '';
      const time = (begin.substring(11,16)) + (end ? '-' + end.substring(11,16) : '');
      const isPast = new Date(l.beginDate) < new Date();
      const color = getLessonColor(l.classInfo?.classId || '');
      const stulist = DATA.students[l.arrangingCoursesId] || [];
      const stus = stulist.slice(0, 10).map(s => '<span class="stu">' + s + '</span>').join('');
      const more = stulist.length > 10 ? '<span class="more">+' + (stulist.length - 10) + '</span>' : '';

      html += '<div class="slot' + (isPast?' past':'') + '" style="border-color:' + color + ';background:' + (isPast?'#f5f5f5':'#f8f9ff') + '" data-teacher="' + teacherName + '" data-cn="' + (cls.name||'').replace(/"/g,'&quot;') + '">' +
        '<div class="time">' + time + '</div>' +
        '<div class="cname">' + ((cls.courseName||cls.name||'').substring(0, 22)) + '</div>' +
        '<div class="info">教室:' + (l.classRoomName||'') + ' | ' + stulist.length + '人</div>' +
        '<div class="teacher">👨‍🏫 ' + teacherName + '</div>' +
        '<div class="stulist">' + stus + more + '</div>' +
        '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('timetable').innerHTML = html;
  renderPills();
}

function renderPills() {
  const counts = {};
  DATA.teachers.forEach(t => { counts[t] = 0; });
  const realWeek = getMondayStr(activeWeek);
  const weekData = DATA.weekDays[realWeek] || [];
  for(let d=0; d<7; d++) {
    for(const l of (weekData[d]||[])) {
      const cls = DATA.classMap[l.classInfo?.classId] || {};
      (cls.teachers||[]).forEach(t => { if(counts[t] !== undefined) counts[t]++; });
    }
  }
  const pills = ['<span class="teacher-pill' + (!activeTeacher?' active':'') + '" onclick="filterTeacher(\'\')">全部</span>'];
  DATA.teachers.forEach(t => {
    const cnt = counts[t] || 0;
    if (cnt > 0 || !activeTeacher) {
      pills.push('<span class="teacher-pill' + (activeTeacher===t?' active':'') + '" onclick="filterTeacher(\'' + t.replace(/'/g,"\\\'") + '\')">' + t + ' <span class="count">(' + cnt + ')</span></span>');
    }
  });
  document.getElementById('teacherPills').innerHTML = pills.join('');
}

function filterTeacher(name) {
  activeTeacher = name || '';
  render();
}
function prevWeek() { const d = new Date(getMondayStr(activeWeek) + 'T00:00:00+08:00'); d.setDate(d.getDate() - 7); activeWeek = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); render(); }
function nextWeek() { const d = new Date(getMondayStr(activeWeek) + 'T00:00:00+08:00'); d.setDate(d.getDate() + 7); activeWeek = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); render(); }
function thisWeek() { activeWeek = getTodayMondayStr(); render(); }
function searchFn(q) {
  if(!q) { document.querySelectorAll('.slot').forEach(s=>s.style.display=''); return; }
  q = q.toLowerCase();
  document.querySelectorAll('.slot').forEach(s => {
    const cn = (s.dataset.cn||'').toLowerCase();
    s.style.display = cn.indexOf(q)>=0 ? '' : 'none';
  });
}
render();
</script>
</body>
</html>
